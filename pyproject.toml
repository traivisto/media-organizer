[project]
name = "mediaidx"
version = "0.1.0"
description = "Local, private index over a home photo archive"
requires-python = ">=3.11,<3.14"
dependencies = [
    "blake3>=1.0",
    "pyexiftool>=0.5.6",
    "pillow>=11",
    "pillow-heif>=1.0",
    "platformdirs>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mediaidx = "mediaidx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mediaidx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
